<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Os Visionários - Custo do Veículo</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin:0; padding:20px 8px; min-height:100vh; color:#1d2633;
         background: linear-gradient(160deg, #0b1a2e, #13294b); }
  header { text-align:center; color:#fff; margin-bottom:18px; }
  header img { width:160px; height:160px; object-fit:cover; border-radius:50%;
               border:3px solid #d4af37; box-shadow:0 4px 16px rgba(0,0,0,.4); }
  header h1 { font-size:1.5rem; margin:12px 0 4px; color:#f5d77a; letter-spacing:1px; }
  header p { margin:0; font-size:.9rem; color:#9fb8d9; }
  .card { background:#fff; width:100%; max-width:560px; margin:0 auto 16px; padding:20px 14px; border-radius:14px;
          box-shadow:0 6px 20px rgba(0,0,0,.3); border-top:4px solid #d4af37; }
  h2 { font-size:1.1rem; margin:0 0 8px; color:#13294b; }
  .aviso { font-size:.8rem; color:#6b7785; margin:0 0 6px; }
  label { display:flex; justify-content:space-between; align-items:center; margin:10px 0; gap:10px; font-size:.95rem; }
  input { width:130px; max-width:45%; padding:7px 9px; border:1px solid #c5ced9; border-radius:8px; text-align:right; font-size:.95rem; }
  input:focus { outline:2px solid #d4af37; border-color:#d4af37; }
  .auto { width:130px; max-width:45%; text-align:right; font-weight:bold; color:#13294b; }
  .tabela-wrap { width:100%; overflow-x:auto; margin-top:16px; -webkit-overflow-scrolling:touch; }
  table { border-collapse:collapse; font-size:.74rem; min-width:100%; }
  th, td { padding:7px 4px; border-bottom:1px solid #eef1f5; text-align:left; }
  th { color:#6b7785; font-size:.72rem; }
  td.v, th.v { text-align:right; white-space:nowrap; }
  td:first-child, th:first-child { min-width:90px; }
  tr.total td { font-weight:bold; border-top:2px solid #13294b; color:#13294b; }
  .destaque { margin-top:20px; background:#13294b; color:#f5d77a; padding:16px; border-radius:10px;
              font-size:1.05rem; text-align:center; font-weight:bold; }
  footer { text-align:center; color:#9fb8d9; font-size:.8rem; margin-top:20px; }
  @media (max-width: 400px) {
    header img { width:130px; height:130px; }
    label { font-size:.9rem; }
    input, .auto { width:110px; }
  }
</style>
</head>
<body>
<header>
  <img src="IMG_20261113_215816.jpg" alt="Logo Os Visionários">
  <h1>OS VISIONÁRIOS</h1>
  <p>Controle de custo do veículo</p>
</header>

<div class="card">
  <h2>Dados do veículo</h2>
  <label>Valor do veículo (R$) <input type="number" id="valor" value="40500"></label>
  <label>IPVA anual, 4% automático (R$) <span class="auto" id="ipvaAuto"></span></label>
  <label>Depreciação anual (%) <input type="number" id="depTaxa" value="10"></label>
  <label>Dias por mês considerados <input type="number" id="dias" value="31"></label>
</div>

<div class="card">
  <h2>Despesas mensais</h2>
  <p class="aviso">Digite os valores de cada mês. O app calcula o anual automaticamente.</p>
  <label>Prestação mensal (R$) <input type="number" id="prestacao" value="520.34"></label>
  <label>Seguro mensal (R$) <input type="number" id="seguro" value="180"></label>
  <label>Licenciamento mensal (R$) <input type="number" id="licenciamento" value="11.33"></label>
  <label>Reserva para manutenção mensal (R$) <input type="number" id="manutencao" value="620"></label>
  <div class="tabela-wrap">
    <table id="tabela"></table>
  </div>
  <div class="destaque" id="resumo"></div>
</div>

<footer>Os Visionários · Foco, força e fé</footer>

<script>
  const fmt = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const get = id => parseFloat(document.getElementById(id).value) || 0;

  function calcular() {
    const valor = get('valor');
    const dias = get('dias') || 31;
    const divisor = dias * 12;

    const ipvaAnual = valor * 0.04;
    document.getElementById('ipvaAuto').textContent = fmt(ipvaAnual);

    const itens = [
      ['IPVA (4%)', ipvaAnual],
      ['Seguro', get('seguro') * 12],
      ['Prestação', get('prestacao') * 12],
      ['Licenciamento', get('licenciamento') * 12],
      ['Reserva manutenção', get('manutencao') * 12],
      ['Depreciação', valor * get('depTaxa') / 100]
    ];

    const total = itens.reduce((soma, item) => soma + item[1], 0);

    let html = '<tr><th>Item</th><th class="v">Mensal</th><th class="v">Anual</th><th class="v">Diário</th></tr>';
    itens.forEach(([nome, anual]) => {
      html += `<tr><td>${nome}</td><td class="v">${fmt(anual / 12)}</td><td class="v">${fmt(anual)}</td><td class="v">${fmt(anual / divisor)}</td></tr>`;
    });
    html += `<tr class="total"><td>Total</td><td class="v">${fmt(total / 12)}</td><td class="v">${fmt(total)}</td><td class="v">${fmt(total / divisor)}</td></tr>`;

    document.getElementById('tabela').innerHTML = html;
    document.getElementById('resumo').textContent = `Custo fixo diário: ${fmt(total / divisor)}`;
  }

  document.querySelectorAll('input').forEach(i => i.addEventListener('input', calcular));
  calcular();
</script>
</body>
</html>
