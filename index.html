<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Os Visionários - Controle de Custo</title>
<style>
  :root { --azul:#4fc3f7; --dourado:#d4af37; --fundo:#0b1622; --card:#132337; --texto:#e8eef5; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,sans-serif; background:linear-gradient(160deg,#0b1622,#16283f); color:var(--texto); margin:0; min-height:100vh; padding:20px; }
  .wrap { max-width:520px; margin:0 auto; }
  .topo { text-align:center; margin-bottom:18px; }
  .topo img { width:180px; height:180px; object-fit:cover; border-radius:50%; border:3px solid var(--dourado); box-shadow:0 0 24px rgba(212,175,55,.35); }
  .topo h1 { font-size:1.4rem; margin:12px 0 0; letter-spacing:1px; color:var(--dourado); }
  .topo p { margin:4px 0 0; color:#9fb3c8; font-size:.9rem; }
  .card { background:var(--card); border-radius:16px; padding:20px; box-shadow:0 4px 18px rgba(0,0,0,.3); border:1px solid #1f3a5a; }
  h2 { font-size:1rem; margin:0 0 10px; color:var(--azul); }
  label { display:flex; justify-content:space-between; align-items:center; margin:10px 0; gap:12px; font-size:.92rem; color:#c9d6e3; }
  input { width:150px; padding:8px 10px; border:1px solid #2c4a6e; border-radius:8px; text-align:right; background:#0b1622; color:var(--texto); font-size:.95rem; }
  input:focus { outline:2px solid var(--azul); }
  table { width:100%; border-collapse:collapse; margin-top:14px; font-size:.92rem; }
  td { padding:9px 4px; border-bottom:1px solid #1f3a5a; }
  td.v { text-align:right; }
  tr.total td { font-weight:bold; border-top:2px solid var(--dourado); border-bottom:none; color:var(--dourado); }
  .destaque { margin-top:18px; background:linear-gradient(90deg,#1b4d7a,#2a6aa3); padding:16px; border-radius:12px; font-size:1.1rem; text-align:center; font-weight:bold; box-shadow:0 0 14px rgba(79,195,247,.25); }
  .rodape { text-align:center; color:#6f859c; font-size:.8rem; margin-top:16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="topo">
    <img src="IMG_216587.jpeg" alt="Logo Os Visionários">
    <h1>OS VISIONÁRIOS</h1>
    <p>Foco, força e fé</p>
  </div>

  <div class="card">
    <h2>Dados do veículo</h2>
    <label>Valor do veículo (R$) <input type="number" id="valor" value="40500"></label>
    <label>IPVA anual (R$) <input type="number" id="ipva" value="968"></label>
    <label>Seguro anual (R$) <input type="number" id="seguro" value="2160"></label>
    <label>Prestação anual (R$) <input type="number" id="prestacao" value="6244.08"></label>
    <label>Licenciamento anual (R$) <input type="number" id="licenciamento" value="135.95"></label>
    <label>Reserva para manutenção anual (R$) <input type="number" id="manutencao" value="7440"></label>
    <label>Depreciação anual (%) <input type="number" id="depTaxa" value="10"></label>
    <label>Dias por mês considerados <input type="number" id="dias" value="31"></label>

    <table id="tabela"></table>
    <div class="destaque" id="resumo"></div>
  </div>

  <div class="rodape">Os Visionários · Transporte executivo</div>
</div>

<script>
  const fmt = v => v.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
  const get = id => parseFloat(document.getElementById(id).value) || 0;

  function calcular() {
    const valor = get('valor');
    const dias = get('dias') || 31;
    const divisor = dias * 12;

    const itens = [
      ['IPVA', get('ipva')],
      ['Seguro', get('seguro')],
      ['Prestação', get('prestacao')],
      ['Licenciamento', get('licenciamento')],
      ['Reserva para manutenção', get('manutencao')],
      ['Depreciação', valor * get('depTaxa') / 100]
    ];

    const total = itens.reduce((soma, item) => soma + item[1], 0);

    let html = '<tr><td>Item</td><td class="v">Anual</td><td class="v">Diário</td></tr>';
    itens.forEach(([nome, anual]) => {
      html += `<tr><td>${nome}</td><td class="v">${fmt(anual)}</td><td class="v">${fmt(anual / divisor)}</td></tr>`;
    });
    html += `<tr class="total"><td>Total</td><td class="v">${fmt(total)}</td><td class="v">${fmt(total / divisor)}</td></tr>`;

    document.getElementById('tabela').innerHTML = html;
    document.getElementById('resumo').textContent = `Custo fixo diário: ${fmt(total / divisor)}`;
  }

  document.querySelectorAll('input').forEach(i => i.addEventListener('input', calcular));
  calcular();
</script>
</body>
</html>
